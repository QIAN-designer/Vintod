<div class="bg-white border border-gray-200 rounded-lg flex flex-col overflow-hidden animate-pulse">
  <div class="h-64 bg-gray-200">
    <ngx-skeleton-loader
      count="1"
      appearance="line"
      [theme]="{ height: '100%', width: '100%', margin: '0', 'border-radius': '0' }"
    ></ngx-skeleton-loader>
  </div>
  <div class="flex-1 p-4 flex flex-col space-y-3">
    <ngx-skeleton-loader
      count="1"
      appearance="line"
      [theme]="{ height: '16px', width: '75%', margin: '0', 'border-radius': '4px' }"
    ></ngx-skeleton-loader>
    <ngx-skeleton-loader
      count="1"
      appearance="line"
      [theme]="{ height: '14px', width: '40%', margin: '0', 'border-radius': '4px' }"
    ></ngx-skeleton-loader>
    <div class="pt-1 flex items-center justify-between">
      <ngx-skeleton-loader
        count="1"
        appearance="line"
        [theme]="{ height: '18px', width: '60px', margin: '0', 'border-radius': '4px' }"
      ></ngx-skeleton-loader>
      <ngx-skeleton-loader
        count="1"
        appearance="line"
        [theme]="{ height: '18px', width: '35px', margin: '0', 'border-radius': '4px' }"
      ></ngx-skeleton-loader>
    </div>
    <div class="pt-1">
      <ngx-skeleton-loader
        count="1"
        appearance="line"
        [theme]="{ height: '16px', width: '90px', margin: '0', 'border-radius': '4px' }"
      ></ngx-skeleton-loader>
    </div>
  </div>
</div>
