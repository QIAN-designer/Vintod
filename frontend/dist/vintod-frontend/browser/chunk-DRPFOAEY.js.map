<div class="bg-surface-container-lowest rounded-2xl overflow-hidden shadow-sm flex flex-col justify-between animate-pulse">
  <div class="p-space-sm flex items-center justify-between">
    <div class="flex items-center gap-2">
      <ngx-skeleton-loader count="1" appearance="circle" [theme]="{ width: '24px', height: '24px', margin: '0' }"></ngx-skeleton-loader>
      <ngx-skeleton-loader count="1" appearance="line" [theme]="{ width: '80px', height: '12px', margin: '0', 'border-radius': '4px' }"></ngx-skeleton-loader>
    </div>
    <ngx-skeleton-loader count="1" appearance="line" [theme]="{ width: '35px', height: '12px', margin: '0', 'border-radius': '4px' }"></ngx-skeleton-loader>
  </div>
  <div class="aspect-[3/4] w-full bg-surface-container">
    <ngx-skeleton-loader count="1" appearance="line" [theme]="{ width: '100%', height: '100%', margin: '0', 'border-radius': '0' }"></ngx-skeleton-loader>
  </div>
  <div class="p-space-md flex flex-col gap-2">
    <div class="flex items-baseline justify-between">
      <ngx-skeleton-loader count="1" appearance="line" [theme]="{ width: '70px', height: '18px', margin: '0', 'border-radius': '4px' }"></ngx-skeleton-loader>
      <ngx-skeleton-loader count="1" appearance="line" [theme]="{ width: '40px', height: '14px', margin: '0', 'border-radius': '4px' }"></ngx-skeleton-loader>
    </div>
    <ngx-skeleton-loader count="1" appearance="line" [theme]="{ width: '120px', height: '12px', margin: '0', 'border-radius': '4px' }"></ngx-skeleton-loader>
    <div class="flex items-center justify-between pt-1">
      <ngx-skeleton-loader count="1" appearance="line" [theme]="{ width: '90px', height: '14px', margin: '0', 'border-radius': '4px' }"></ngx-skeleton-loader>
      <ngx-skeleton-loader count="1" appearance="line" [theme]="{ width: '30px', height: '12px', margin: '0', 'border-radius': '4px' }"></ngx-skeleton-loader>
    </div>
  </div>
</div>
